[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/store",
    "crates/scan",
    "crates/parse",
    "crates/index",
    "crates/ingest",
    "crates/query",
    "crates/hw",
    "crates/model",
    "crates/tools",
    "crates/net",
    "crates/mcp",
    "crates/desktop",
    "crates/cli",
]

[workspace.package]
version = "0.0.6"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
marrow-core  = { path = "crates/core" }
marrow-store = { path = "crates/store" }
marrow-scan  = { path = "crates/scan" }
marrow-parse = { path = "crates/parse" }
marrow-index = { path = "crates/index" }
marrow-ingest = { path = "crates/ingest" }
marrow-query = { path = "crates/query" }
marrow-hw    = { path = "crates/hw" }
marrow-model = { path = "crates/model" }
marrow-tools = { path = "crates/tools" }
marrow-net   = { path = "crates/net" }
marrow-mcp   = { path = "crates/mcp" }

anyhow     = "1"
thiserror  = "2"
blake3     = "1"
rusqlite   = { version = "0.32", features = ["bundled", "backup"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ulid       = "1"

[profile.release]
opt-level = 3
