[package]
name = "marrow-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
marrow-core.workspace = true
# The containment proof (`AuthorizedRoot`), the NFC path identity and the
# placeholder guard already exist in `marrow-scan`. A second implementation of
# any of them would be a second thing to get wrong.
marrow-scan.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ulid.workspace = true

# Not in `[workspace.dependencies]`: only this crate reads the corpus, and only
# this crate folds a path component to catch a Unicode dot wearing a costume.
toml = "0.8"
# Format-preserving TOML editing. Already in the tree via `toml` itself, and
# the entire value of a structural edit is that comments, key order and
# whitespace survive it — `toml`'s own round-trip would not keep any of them.
toml_edit = "0.20"
unicode-normalization = "0.1"

[dev-dependencies]
# To backdate a snapshot, so the age-based retention rules are testable without
# waiting fourteen days. Already in the tree via `notify`.
filetime = "0.2"
tempfile = "3"
