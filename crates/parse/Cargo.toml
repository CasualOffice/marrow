[package]
name = "marrow-parse"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
marrow-core.workspace = true
serde.workspace = true
tracing.workspace = true

# Not in `[workspace.dependencies]`: only this crate turns bytes into an IR, so
# the format libraries live here rather than widening the workspace surface.
# Deliberately absent: `marrow-scan`. Parsers take bytes plus a `FileProbe`,
# never a path — see the note on `FileProbe` in `parser.rs`.

# Text decoding. `encoding_rs` does the transcoding, `chardetng` guesses the
# label when there is no BOM and the bytes are not valid UTF-8.
encoding_rs = "0.8"
chardetng = "0.1"

# Markdown. `into_offset_iter()` is the reason for this crate specifically: it
# hands back a byte range with every event, which is exactly the `source_span` rule.
pulldown-cmark = { version = "0.13", default-features = false, features = ["simd"] }

# Code. Grammars are chosen by real corpus counts (bench/M0-corpus.md §6).
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-javascript = "0.25"
tree-sitter-python = "0.25"
tree-sitter-sequel = "0.3"

# Structured config.
# `toml_edit` rather than `toml`: it keeps a byte span on every key and value.
# `toml` deserializes into typed structs and throws the offsets away.
toml_edit = { version = "0.25", default-features = false, features = ["parse"] }
serde_json = { workspace = true }
yaml-rust2 = "0.12"

# XLSX (§99.5: "native, calamine-class"). Chosen for the one thing a hand-rolled
# reader would have to reimplement badly: `xl/styles.xml` decides whether a
# serial number is a date, and getting that wrong turns 45943 into a quantity.
# No `dates` feature — that pulls `chrono` in only to format a date, and
# `ExcelDateTime::to_ymd_hms_milli` already hands back the components.
calamine = "0.36"

# The OOXML container. Both formats are zips, and a zip from a user's disk is
# untrusted input — see `ooxml.rs` for the ceilings. `deflate` only: an Office
# part is deflated or stored, and bzip2/lzma/zstd/AES are attack surface for
# codecs the format never uses. Version pinned to the one `calamine` resolves
# so there is a single zip implementation in the tree.
zip = { version = "8", default-features = false, features = ["deflate"] }

# DOCX. A streaming XML reader rather than a DOCX crate, for the same reason
# `csv.rs` has no `csv` crate and `html.rs` has no tree builder: a document
# model gives excellent nodes and no positions, and a DOCX cell's provenance
# *is* its position in the XML tree. See `docx.rs`.
quick-xml = "0.41"
tree-sitter-java = "0.23"

# No `csv` crate: `ByteRecord::range()` indexes the record's private buffer, not
# the source, so cell provenance would have to be reconstructed anyway. See
# `csv.rs` — a quote-aware splitter that yields source ranges directly is both
# smaller and the only version that can satisfy the `source_span` rule.

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
# PDFKit is on every Mac. The alternative is vendoring a multi-megabyte
# Chromium library to do what the OS already does — including per-character
# bounding boxes, which is what makes an exact citation possible at all.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSString", "NSURL", "NSData", "NSValue", "NSGeometry", "NSArray", "NSDictionary", "NSError"] }
objc2-pdf-kit = { version = "0.3", features = ["PDFDocument", "PDFPage"] }

# OCR, through Vision (D13 — the OCR engine is platform-native). Same argument
# as PDFKit: the recogniser is already on the machine, needs no model download
# and no network, and it reports a normalised bounding box per line, which is
# the only reason an OCR'd image can be cited at all.
#
# Features are named per header rather than taking the default set: the default
# pulls in AVFoundation, CoreMedia and CoreVideo for the video-frame request
# handlers, none of which this crate has any use for.
objc2-vision = { version = "0.3", default-features = false, features = [
    "VNRequest",
    "VNRequestHandler",
    "VNRecognizeTextRequest",
    "VNObservation",
    "VNTypes",
    "objc2-core-foundation",
    "objc2-core-image",
] }

# CoreImage is here for `CIImage::extent`, not for filtering. Vision reports
# boxes normalised to the image it was handed, so turning one back into pixels
# needs that image's size — and taking it from the same `CIImage` Vision reads
# is the only way to be sure the two agree about orientation and scale. Parsing
# the dimensions out of the file header separately would be a second opinion,
# and a second opinion is how a box ends up drawn in the wrong place.
objc2-core-image = { version = "0.3", default-features = false, features = [
    "CIImage",
    "CIColor",
    "objc2-core-foundation",
] }
