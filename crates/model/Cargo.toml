[package]
name = "marrow-model"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
marrow-core.workspace = true
marrow-store.workspace = true
marrow-hw.workspace = true
marrow-index.workspace = true
# For `addr::classify` only. Three notations for 127.0.0.1 must not be three
# chances to get the boundary label wrong (NET-009), and that unwrapping is
# already written and tested next door.
marrow-net.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
blake3.workspace = true
# HTTPS for model downloads. Blocking on purpose: the supervisor is one
# synchronous thread, and pulling in an async runtime for a file transfer would
# make every caller async to save nothing. rustls rather than OpenSSL so there
# is no system TLS library to go missing.
ureq = { version = "3", default-features = false, features = ["rustls"] }
sha2 = "0.10"
# The OS keyring, for a provider key (LLM-030, SEC-005). `apple-native` is the
# macOS keychain; no other backend is compiled in, because there is no other
# platform to be wrong about.
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
# For reading a child process's resident size. See `worker::Watchdog` for why
# an rlimit is not the mechanism on this platform.
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# To assert that a provider key never reaches a log line. Capturing `tracing`
# output needs a subscriber, and a rule with no test is a comment.
tracing-subscriber.workspace = true
