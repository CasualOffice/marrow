[package]
name = "marrow-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

# A library as well as a binary, so the pipeline can be exercised from an
# integration test. A bin-only crate whose logic cannot be reached from outside
# is how the seam between indexing, retrieval and generation went untested for
# as long as it did.
[lib]
name = "marrow_desktop"
path = "src/lib.rs"

[[bin]]
name = "marrow-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
marrow-core.workspace = true
marrow-store.workspace = true
marrow-index.workspace = true
marrow-scan.workspace = true
marrow-ingest.workspace = true
marrow-hw.workspace = true
marrow-model.workspace = true
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
tempfile = "3"
