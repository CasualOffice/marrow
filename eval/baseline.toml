# Committed retrieval baseline. Regenerate with:
#
#     MARROW_EVAL_BLESS=1 cargo test -p marrow-query --test eval
#
# A re-bless is a claim that the numbers below are the new truth. Say why
# in the commit message, or it is a regression filed as an improvement.
#
# `lexical` is `search` — the branch that answers with no model, no GPU and
# no network. `hybrid` is `search_hybrid` fused with the stub embedder in
# `eval/concepts.toml`, so it measures the fusion pipeline and not any real
# embedding model.

