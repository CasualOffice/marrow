name: release

# Tag-driven, and only tags. A release that can be triggered by a branch push is
# a release that happens by accident.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    # Apple Silicon. The reference platform (D5), and the only one that works
    # today — cloud-placeholder detection fails closed everywhere else, so a
    # Linux or Windows build would run and index nothing. See the README.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # **Before the check, not after it.** `tauri::generate_context!()` reads
      # `frontendDist` — `./ui/dist` — at compile time, and that directory is
      # gitignored build output, so a clean checkout does not have it and
      # `cargo clippy --workspace --all-targets` cannot compile `marrow-desktop`
      # without it. This step used to sit *below* the check, so the release
      # would have died at `./check.sh` exactly the way every CI run did.
      - name: build the ui
        working-directory: crates/desktop/ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      # The same gate as CI. A tag that has not passed the checks is not a
      # release, it is a mistake with a version number.
      - name: check
        run: ./check.sh

      - name: build the app and the cli
        run: |
          cargo build --release -p marrow-desktop -p marrow-cli

      # `tauri build` does the bundling; the binaries above are what the CLI
      # artifact ships. Unsigned deliberately — see the release notes.
      #
      # **Run from the app directory, not from the workspace root with
      # `--config`.** Every relative path in `tauri.conf.json` — `frontendDist`
      # of `./ui/dist`, `beforeBuildCommand` of `pnpm --dir ui build` — is
      # relative to the Tauri app directory, which is wherever the config lives.
      # Passing `--config crates/desktop/tauri.conf.json` from the root does not
      # move the app directory there; tauri resolved it one level off and ran
      # `pnpm --dir ui build` against `crates/ui`, which does not exist.
      #
      # The `--no-bundle` warm-up pass is gone with it. It was followed by
      # `|| true`, so it could only ever hide a failure that the next line was
      # about to hit anyway.
      - name: bundle
        working-directory: crates/desktop
        run: |
          cargo install tauri-cli --version "^2" --locked || true
          cargo tauri build

      # **The bundle must carry a valid signature, and v0.0.1 and v0.0.2 did
      # not.** Tauri skips bundle signing when no identity is configured, so
      # the app shipped with only the linker's adhoc signature on the Mach-O
      # and no `_CodeSignature/CodeResources` at all. That runs fine on the
      # machine that built it — a locally built app is not quarantined — and
      # dies instantly on any Mac that downloaded it, because Gatekeeper
      # evaluates the bundle, finds the signature invalid, and Apple Silicon
      # makes that fatal. The symptom is the worst kind: one bounce in the
      # Dock and no dialog, so nothing tells the user what happened.
      #
      # `signingIdentity: "-"` in `tauri.conf.json` fixes it. This step is
      # here so that a regression in that config cannot ship silently again —
      # the build fails rather than producing an app nobody can open.
      - name: the bundled app must actually be signed
        run: |
          set -euo pipefail
          app=target/release/bundle/macos/Marrow.app
          test -f "$app/Contents/_CodeSignature/CodeResources" \
            || { echo "::error::no _CodeSignature — the bundle was never signed"; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "signature is valid on disk"

      # **The pinned runtime archive must exist and match.**
      #
      # This is the check whose absence shipped four broken releases. Every one
      # of them verified `mlx_worker.py` was in `Contents/Resources` — on the
      # machine that built it, which is the one machine that already had an
      # interpreter in its data directory, so the missing half could not
      # register. "Verifying an artifact where the defect cannot appear is not
      # evidence" is already a line in this repo's tracker.
      #
      # So: fetch what the app will fetch, from the URL the app will use, and
      # hash it. A pin pointing at a tag that was never published, or at an
      # archive rebuilt since, fails the release instead of shipping an app
      # whose "Install runtime" button 404s.
      - name: the pinned runtime archive must resolve
        run: |
          set -euo pipefail
          pin="$(grep -A14 'pub const ARCHIVE' crates/model/src/runtime.rs)"
          url="$(sed -n 's/.*url: "\(.*\)".*/\1/p' <<<"$pin")"
          want="$(sed -n 's/.*sha256: "\([0-9a-f]\{64\}\)".*/\1/p' <<<"$pin")"

          if [ -z "$want" ]; then
            echo "::error::runtime.rs carries no digest — publish a runtime-vN tag and pin what it printed"
            exit 1
          fi
          echo "pinned $want"
          echo "at     $url"

          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/runtime.tar.gz"
          got="$(shasum -a 256 "$RUNNER_TEMP/runtime.tar.gz" | cut -d" " -f1)"
          if [ "$got" != "$want" ]; then
            echo "::error::the published runtime is not the one pinned (got $got)"
            exit 1
          fi
          echo "the archive the app will download is the archive it expects"

      - name: collect
        id: collect
        run: |
          set -euo pipefail
          mkdir -p dist
          # The CLI, on its own. It is the half that needs no GPU, no model and
          # no network, and plenty of people will only ever want this.
          tar -czf "dist/marrow-cli-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz" \
            -C target/release marrow
          find target/release/bundle -name '*.dmg' -exec cp {} dist/ \; || true
          find target/release/bundle -name '*.app' -maxdepth 3 -print0 \
            | while IFS= read -r -d '' app; do
                ditto -c -k --sequesterRsrc --keepParent "$app" \
                  "dist/Marrow-${GITHUB_REF_NAME}-aarch64.app.zip"
              done
          ( cd dist && shasum -a 256 * > SHA256SUMS.txt )
          ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          # **Not a prerelease, and that is a deliberate reversal.**
          #
          # v0.0.1 through v0.0.5 were all marked `prerelease: true` to say
          # "this is early". The cost of saying it that way was invisible until
          # the repository went public: GitHub resolves `releases/latest` to the
          # newest **non**-prerelease, so with every release a prerelease there
          # was no latest release at all. `releases/latest` redirected to the
          # index and `releases/latest/download/…` 404ed — for every build ever
          # shipped. `site/install.html` links at both.
          #
          # `make_latest: true` cannot fix that on its own; GitHub refuses it on
          # a prerelease ("Latest release cannot be draft or prerelease"). So the
          # claim about maturity moves to where it is read anyway — the release
          # notes below say unsigned, Apple Silicon only, and early, in
          # sentences rather than in a flag — and the flag goes back to meaning
          # what it navigates to.
          prerelease: false
          # And say it rather than leave it to a date comparison: publishing a
          # `runtime-vN` archive is newer than the last app release, and briefly
          # made a 193 MB Python tarball the top of the releases page.
          make_latest: true
          body: |
            **Apple Silicon macOS only.** Windows and Linux do not work yet, and
            the README says exactly why: cloud-placeholder detection is
            implemented for macOS alone and fails closed elsewhere, so those
            builds would run and index nothing. That is the safe direction, not
            an oversight.

            ### This build is not signed or notarised

            macOS will refuse to open it on the first try, with **"Apple could
            not verify 'Marrow' is free of malware that may harm your Mac or
            compromise your privacy."** That is Gatekeeper doing its job on an
            unsigned binary from the internet, and you should be suspicious of
            anyone who tells you to ignore it.

            The one-line install downloads this release, **verifies it against
            the checksum below**, installs it and clears the flag:

            ```sh
            curl -fsSL https://raw.githubusercontent.com/CasualOffice/marrow/main/install.sh | bash
            ```

            [Read it first](https://github.com/CasualOffice/marrow/blob/main/install.sh) —
            it is short, and its header lists everything it does. By hand
            instead, after dragging the app to Applications:

            ```sh
            xattr -dr com.apple.quarantine /Applications/Marrow.app
            ```

            Note that on macOS 15 and later, right-clicking and choosing
            **Open** no longer works as a way through; the equivalent is
            **System Settings → Privacy & Security → Open Anyway**. Or build
            from source — `cargo tauri build` — which avoids the question
            entirely, because nothing you compiled yourself is quarantined.

            The CLI tarball has the same caveat and the same fix.

            ### What works

            Indexing, lexical and filename search, `--literal` exact scan,
            filters, tables from CSV/Markdown/HTML/XLSX/DOCX, PDF text with
            per-character boxes, text in images, an MCP server with ten tools,
            and a desktop app that answers questions with citations.

            Answers need two things: a runtime and a model. The Models page
            installs both — the runtime is a 193 MB download that brings its
            own Python, so nothing has to be set up by hand and nothing else on
            the machine is touched. Or point Settings at any OpenAI-compatible
            endpoint and skip both. **Search itself never needs a model, a
            runtime, a GPU or a network.**

            Releases before v0.0.5 could not answer a question on any machine
            but the one that built them: the app expected an MLX interpreter it
            never shipped, and the printed fix began with a command macOS does
            not have. If you tried an earlier build and gave up here, this is
            the one that works.

            Verify what you downloaded against `SHA256SUMS.txt`.
