name: pages

# The site is a handful of static files with no build step — plain HTML, one
# stylesheet, no JavaScript and no CDN — so there is nothing to compile and
# nothing to go stale between the source and what ships. `site/` is uploaded
# verbatim; adding a build step here would reintroduce exactly that gap.
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one half-way: a cancelled Pages deploy
# can leave the site serving a partial upload.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
